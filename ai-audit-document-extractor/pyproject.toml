[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-audit-document-extractor"
version = "0.1.0"
description = "Extract financial tables from PDFs, Excel files, and CSV files, then validate and reconcile them."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayham Ali" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
audit-extract = "audit_doc_extractor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
