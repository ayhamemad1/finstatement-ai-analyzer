name: Audit Projects CI

on:
  push:
    paths:
      - 'ai-audit-document-extractor/**'
      - 'llm-audit-assistant/**'
      - '.github/workflows/audit-projects-ci.yml'
  pull_request:
    paths:
      - 'ai-audit-document-extractor/**'
      - 'llm-audit-assistant/**'
      - '.github/workflows/audit-projects-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - ai-audit-document-extractor
          - llm-audit-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: pytest -q
