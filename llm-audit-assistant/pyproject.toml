[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-audit-assistant"
version = "0.1.0"
description = "Retrieval-based assistant for audit policies, financial reports, and exception logs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayham Ali" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
llm-audit = "llm_audit_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
